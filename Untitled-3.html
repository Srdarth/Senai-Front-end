    <script>
    
    let numeros = [2,5,8,11,15,7,3,6,9];
    for (let i = 0; i<8; i++){
        if (numeros[i] % 2 ==0){
            console.log(numeros[i] + " É PAR");

            console.log(numeros[i]+ " É IMPAR");
        }
    }
    
    </script>
